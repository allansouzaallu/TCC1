name: TCC N20 live benchmark

on:
  push:
    branches: [codex/tcc-live-n20]
    paths: ["infra/runpod/n20/**", ".github/workflows/live-n20.yml"]
  workflow_dispatch:
    inputs:
      operation:
        description: "Preflight only, or run one scenario on an existing dedicated CUDA runner"
        type: choice
        default: preflight
        options: [preflight, live]
      scenario:
        description: "Scenario to run (used only for live execution)"
        type: choice
        default: baseline
        options: [baseline, m20-alto, m40-alto, m80-alto, m40-sutil, m80-sutil]
      seed:
        description: "Scenario seed (0 to 4)"
        type: choice
        default: "0"
        options: ["0", "1", "2", "3", "4"]
      acknowledge_live:
        description: "Authorize this workflow to consume existing runner time (no provisioning)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r sistema/requirements-node.txt -r sistema/requirements-orchestrator.txt
      - name: Validate topology and test dedicated inference with mocks
        run: |
          python -m infra.runpod.n20.benchmark preflight
          python -m unittest sistema.tests.test_dedicated_inference sistema.tests.test_dedicated_orchestrator sistema.tests.test_runner_per_node
          python -m unittest infra.runpod.n20.test_benchmark
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - name: Provider-free Terraform preflight
        working-directory: infra/runpod/n20
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
          terraform plan -input=false -refresh=false -no-color

  live:
    if: '${{ github.event_name == ''workflow_dispatch'' && github.ref == ''refs/heads/codex/tcc-live-n20'' && inputs.operation == ''live'' && inputs.acknowledge_live && vars.TCC_LIVE_N20_ENABLED == ''true'' }}'
    needs: preflight
    environment: tcc-live-n20
    runs-on: [self-hosted, linux, x64, tcc-n20-cuda]
    timeout-minutes: 120
    concurrency:
      group: tcc-live-n20-gpu
      cancel-in-progress: false
    env:
      TCC_LIVE_N20_APPROVED: "true"
      NVIDIA_MODEL_SNAPSHOT: '${{ vars.TCC_LIVE_N20_SNAPSHOT }}'
      SCENARIO: '${{ inputs.scenario }}'
      SEED: '${{ inputs.seed }}'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run and verify 1000 own generations
        run: |
          test -n "$NVIDIA_MODEL_SNAPSHOT"
          python -m infra.runpod.n20.benchmark run --scenario "$SCENARIO" --seed "$SEED" \
            --snapshot "$NVIDIA_MODEL_SNAPSHOT" --output "$RUNNER_TEMP/tcc-n20-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Save metrics, runtime records and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'live-n20-${{ github.run_id }}-${{ github.run_attempt }}'
          path: '${{ runner.temp }}/tcc-n20-${{ github.run_id }}-${{ github.run_attempt }}/'
          if-no-files-found: ignore
          retention-days: 14
